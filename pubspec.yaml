name: gset_test_series
description: GSET Paper-I bilingual test series app.
publish_to: 'none'
version: 1.4.0+4

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.2.0

flutter:
  uses-material-design: true
  assets:
    - assets/questions.json
    - assets/papers.json
    - assets/verification_status.json
    - assets/
    - assets/sources/
    - assets/source_papers/

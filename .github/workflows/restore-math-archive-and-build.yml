name: Restore Mathematical Sciences Archive and Build Debug APK

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/restore-math-archive-and-build.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  restore-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Recover archived Mathematical Sciences questions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/math-archive
          curl --fail --location \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/12282244264/zip" \
            -o /tmp/math-archive/archive.zip
          unzip -o /tmp/math-archive/archive.zip -d /tmp/math-archive/extracted
          python3 - <<'PY'
          import json, pathlib
          root = pathlib.Path('/tmp/math-archive/extracted')
          qpath = root / 'questions.json'
          ppath = root / 'papers.json'
          questions = json.loads(qpath.read_text(encoding='utf-8'))
          papers = json.loads(ppath.read_text(encoding='utf-8'))
          assert isinstance(questions, list) and len(questions) == 1111, f'Expected 1111 questions, got {len(questions) if isinstance(questions, list) else type(questions)}'
          assert isinstance(papers, dict) and len(papers.get('papers', [])) == 19, 'Expected 19 archive paper records'
          # Keep unverified records explicitly flagged for review; never promote OCR data to verified.
          for q in questions:
              if q.get('source_verified') is not True:
                  q['source_verified'] = False
                  q['review_flag'] = True
                  q.setdefault('review_note', 'Recovered archive; verify wording, options, equations and official final answer key against the original GSET source before marking verified.')
          out = pathlib.Path('assets/subjects/mathematical_sciences/questions.json')
          out.write_text(json.dumps(questions, ensure_ascii=False, indent=2) + '\\n', encoding='utf-8')
          # Restore the archive's paper metadata only if the checked-in file is missing/invalid.
          existing = pathlib.Path('assets/subjects/mathematical_sciences/papers.json')
          try:
              current = json.loads(existing.read_text(encoding='utf-8'))
          except Exception:
              current = {}
          if not isinstance(current, dict) or len(current.get('papers', [])) != 19:
              existing.write_text(json.dumps(papers, ensure_ascii=False, indent=2) + '\\n', encoding='utf-8')
          print(f'Recovered {len(questions)} questions; {sum(q.get("review_flag") is True for q in questions)} flagged for review.')
          PY

      - name: Validate subject assets
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for subject, expected in [('mathematical_sciences', 1111), ('public_administration', 300)]:
              p = Path(f'assets/subjects/{subject}/questions.json')
              data = json.loads(p.read_text(encoding='utf-8'))
              assert isinstance(data, list), f'{subject}: expected JSON list'
              assert len(data) >= expected, f'{subject}: expected at least {expected}, got {len(data)}'
              print(f'{subject}: {len(data)} questions JSON-valid')
          PY

      - name: Commit recovered archive if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/subjects/mathematical_sciences/questions.json assets/subjects/mathematical_sciences/papers.json
          if ! git diff --cached --quiet; then
            git commit -m "Restore recovered Mathematical Sciences question bank"
            git push
          else
            echo "No archive changes needed."
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Build universal Debug APK
        run: flutter build apk --debug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: gset-test-series-debug-apk-restored
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

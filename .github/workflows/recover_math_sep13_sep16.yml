name: Recover Mathematical Sciences Sep 2013 and Sep 2016

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover_math_sep13_sep16.yml'
      - 'tool/import_mathematical_targets.py'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install PDF and OCR tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr
      - name: Import official September 2013 and September 2016 Paper-II
        run: python3 tool/import_mathematical_targets.py
      - name: Validate JSON and report recovery counts
        run: |
          python3 - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          qpath = Path("assets/subjects/mathematical_sciences/questions.json")
          mpath = Path("assets/subjects/mathematical_sciences/papers.json")
          questions = json.loads(qpath.read_text(encoding="utf-8"))
          metadata = json.loads(mpath.read_text(encoding="utf-8"))
          assert isinstance(questions, list), "Question bank must be a JSON list"
          ids = [item.get("id") for item in questions]
          assert all(ids), "Every question must have an ID"
          assert len(ids) == len(set(ids)), "Duplicate question IDs found"
          for item in questions:
              assert item.get("answer") in {"A", "B", "C", "D", "Z"}, f"Invalid answer: {item.get('id')}"
              assert isinstance(item.get("options_en"), list) and len(item["options_en"]) == 4, f"Four English options required: {item.get('id')}"
              assert isinstance(item.get("options_gu"), list) and len(item["options_gu"]) == 4, f"Four Gujarati options required: {item.get('id')}"
          counts = Counter(item.get("paper_id") for item in questions)
          papers = {item.get("paper_id"): item for item in metadata.get("papers", [])}
          for session in ("sep13", "sep16"):
              pid = f"mathematical_sciences_{session}"
              count = counts.get(pid, 0)
              print(f"{pid}: {count}/50 questions; answer_key_verified={papers.get(pid, {}).get('answer_key_verified', False)}")
              assert count > 0, f"No source questions recovered for {pid}; refusing to persist an empty result"
          print(f"Validated {len(questions)} unique Mathematical Sciences question records.")
          print("OCR-imported questions remain review_flag=true/source_verified=false until manual source-page verification.")
          PY
      - name: Persist recovered archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/subjects/mathematical_sciences/questions.json assets/subjects/mathematical_sciences/papers.json
          if git diff --cached --quiet; then
            echo "No changes to persist."
          else
            git commit -m "Recover Mathematical Sciences September 2013 and 2016 archive"
            git push
          fi

name: Flutter app validation

on:
  push:
    branches:
      - main
      - integrate/public-administration-subject
  pull_request:
    branches:
      - main

jobs:
  flutter-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Resolve dependencies
        run: flutter pub get
      - name: Build debug APK
        run: flutter build apk --debug

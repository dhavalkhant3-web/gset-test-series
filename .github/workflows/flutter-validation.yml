name: Flutter app validation

on:
  push:
    branches:
      - main
      - integrate/public-administration-subject
  pull_request:
    branches:
      - main

jobs:
  flutter-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Performing Arts official question bank
        run: |
          if [ -f assets/subjects/performing_art_dance_drama_theatre/questions.json ] && [ -f tools/validate_performing_arts.py ]; then
            python tools/validate_performing_arts.py
          else
            echo "Performing Arts validator skipped because the subject bank is not present in this ref."
          fi
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Resolve dependencies
        run: flutter pub get
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gset-test-series-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

name: Flutter app validation

on:
  push:
    branches:
      - main
      - integrate/public-administration-subject
  pull_request:
    branches:
      - main

jobs:
  flutter-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Indian Knowledge System official question bank
        run: python tools/validate_indian_knowledge_system.py
      # The Performing Arts subject is maintained on its own active branch and is
      # validated against the last audited source commit, without merging its app/data changes here.
      - name: Checkout Performing Arts validation snapshot
        uses: actions/checkout@v4
        with:
          ref: 8c8b80bb5aa333207f175bf12d191c4d8e1546ed
          path: validation/performing-arts
      - name: Validate Performing Arts official question bank
        run: python tools/validate_performing_arts.py
        working-directory: validation/performing-arts
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Resolve dependencies
        run: flutter pub get
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gset-test-series-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

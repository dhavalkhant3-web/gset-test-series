name: Build verified Dec 2021 Chemical Sciences visual assets

on:
  push:
    branches: [main]
    paths:
      - "tool/extract_chemical_dec21_visuals.py"
      - ".github/workflows/chemical_dec21_visuals.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-visual-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF crop dependency
        run: python -m pip install --disable-pip-version-check pymupdf
      - name: Render official source crops
        run: python tool/extract_chemical_dec21_visuals.py
      - name: Verify all 33 assets
        run: |
          test "$(find assets/images -maxdepth 1 -name 'chemical_dec21_q*.png' | wc -l)" -eq 33
          python - <<'PY'
          import pathlib
          expected={18,19,20,28,31,40,43,47,49,52,53,60,64,71,72,75,76,77,78,79,80,81,82,83,84,85,86,87,88,89,90,91,93}
          got={int(p.stem.rsplit("q",1)[1]) for p in pathlib.Path("assets/images").glob("chemical_dec21_q*.png")}
          assert got == expected, (sorted(got), sorted(expected))
          print("Verified 33 source-preserving Dec-2021 visual assets.")
          PY
      - name: Commit verified visual assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/chemical_dec21_q*.png
          if git diff --cached --quiet; then
            echo "No visual asset changes."
            exit 0
          fi
          git commit -m "Add verified Dec 2021 Chemical visual assets"
          git push origin HEAD:main

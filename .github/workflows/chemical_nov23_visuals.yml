name: Build verified Nov 2023 Chemical Sciences visual assets

on:
  push:
    branches: [main]
    paths:
      - "tool/extract_chemical_nov23_visuals.py"
      - ".github/workflows/chemical_nov23_visuals.yml"
  workflow_dispatch:

permissions:
  contents: write
jobs:
  build-visual-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --disable-pip-version-check pymupdf
      - run: python tool/extract_chemical_nov23_visuals.py
      - name: Verify expected assets
        run: |
          python - <<'PY'
          import pathlib
          e={13,16,31,58,59,64,69,72,76,77,82,84,85,91,93,96,97,98,99}
          g={int(p.stem.rsplit("q",1)[1]) for p in pathlib.Path("assets/images").glob("chemical_nov23_q*.png")}
          assert e <= g, (sorted(g),sorted(e))
          PY
      - name: Commit verified visual assets
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/chemical_nov23_q*.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add verified Nov 2023 Chemical visual assets"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

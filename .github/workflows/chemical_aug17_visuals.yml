name: Build verified Aug 2017 Chemical Sciences visual assets

on:
  push:
    branches: [main]
    paths:
      - "tool/extract_chemical_aug17_visuals.py"
      - ".github/workflows/chemical_aug17_visuals.yml"
  workflow_dispatch:

permissions:
  contents: write
jobs:
  build-visual-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --disable-pip-version-check pymupdf
      - run: python tool/extract_chemical_aug17_visuals.py
      - name: Verify expected assets
        run: |
          python - <<'PY'
          import pathlib
          e={34,35,39,43,44}
          g={int(p.stem.rsplit("q",1)[1]) for p in pathlib.Path("assets/images").glob("chemical_aug17_q*.png")}
          assert e <= g, (sorted(g),sorted(e))
          PY
      - name: Commit verified visual assets
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/chemical_aug17_q34.png assets/images/chemical_aug17_q35.png assets/images/chemical_aug17_q39.png assets/images/chemical_aug17_q43.png assets/images/chemical_aug17_q44.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add verified Aug 2017 Chemical visual assets"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

name: Debug Chemical Dec 2021 PDF extraction

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install PDF and OCR tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr
      - name: Download official Dec 2021 Chemical Sciences paper
        run: |
          mkdir -p build/chemical_dec21
          curl -L --fail --retry 5 --retry-delay 5 --connect-timeout 30 --max-time 300 --insecure -o build/chemical_dec21/dec2103.pdf https://www.gujaratset.ac.in/assets/papers/paperII/dec21/dec2103.pdf
          pdfinfo build/chemical_dec21/dec2103.pdf | head -20
      - name: Render and OCR official PDF
        run: |
          mkdir -p build/chemical_dec21/pages build/chemical_dec21/ocr
          pdftoppm -jpeg -r 300 -gray build/chemical_dec21/dec2103.pdf build/chemical_dec21/pages/page
          for f in build/chemical_dec21/pages/*.jpg; do
            base=$(basename "$f" .jpg)
            tesseract "$f" "build/chemical_dec21/ocr/$base" --psm 6 2>/dev/null || true
            tesseract "$f" "build/chemical_dec21/ocr/$base-11" --psm 11 2>/dev/null || true
          done
          for f in build/chemical_dec21/ocr/*.txt; do
            echo "===== $f ====="
            cat "$f"
          done > build/chemical_dec21/ocr_combined.txt
          wc -l build/chemical_dec21/ocr_combined.txt
          sed -n '1,900p' build/chemical_dec21/ocr_combined.txt
      - name: Upload OCR and rendered source pages
        uses: actions/upload-artifact@v4
        with:
          name: chemical-dec21-ocr-300dpi
          path: |
            build/chemical_dec21/ocr_combined.txt
            build/chemical_dec21/pages/*.jpg

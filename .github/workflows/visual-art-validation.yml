name: Visual Art bank validation

on:
  push:
    branches:
      - complete-visual-arts-33
    paths:
      - 'assets/subjects/visual_art/**'
      - 'assets/subjects/subjects.json'
      - 'tools/validate_visual_art.py'
      - '.github/workflows/visual-art-validation.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'assets/subjects/visual_art/**'
      - 'assets/subjects/subjects.json'
      - 'tools/validate_visual_art.py'
      - '.github/workflows/visual-art-validation.yml'

jobs:
  validate-visual-art:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Visual Art bank and official final keys
        run: python tools/validate_visual_art.py
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Set up Java 21 for Gradle compatibility
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Flutter version
        run: flutter --version
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Build combined Android Debug APK
        run: flutter build apk --debug
      - name: Upload combined Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: gset-test-series-visual-art-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

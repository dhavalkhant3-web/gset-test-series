name: Integration Debug APK

on:
  push:
    branches:
      - integration/combined-subject-banks
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze Flutter app
        run: flutter analyze

      - name: Build combined Debug APK
        run: flutter build apk --debug

      - name: Upload combined Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: gset-test-series-integration-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

name: Hindu Studies Code 28 Validation and Debug APK

on:
  pull_request:
    branches:
      - integration/combined-subject-banks
    paths:
      - 'assets/subjects/hindu_studies/**'
      - 'assets/subjects/syllabus_units.json'
      - 'assets/subjects/subjects.json'
      - '.github/workflows/hindu-studies-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Hindu Studies bank and metadata
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path(".")
          def read(path):
              with (root / path).open(encoding="utf-8") as f:
                  return json.load(f)
          questions = read("assets/subjects/hindu_studies/questions.json")
          papers = read("assets/subjects/hindu_studies/papers.json")["papers"]
          registry = read("assets/subjects/subjects.json")["subjects"]
          syllabus = read("assets/subjects/syllabus_units.json")["subjects"]["hindu_studies"]["units"]
          pending = read("assets/subjects/hindu_studies/verification_pending.json")
          errors = []
          if len(questions) != 300:
              errors.append(f"Expected 300 questions; found {len(questions)}")
          ids = [q.get("id") for q in questions]
          if len(ids) != len(set(ids)):
              errors.append("Duplicate or missing question IDs")
          expected_papers = {
              "hindu_studies_nov23",
              "hindu_studies_dec24",
              "hindu_studies_nov25",
          }
          by_paper = {}
          for q in questions:
              by_paper.setdefault(q.get("paper_id"), []).append(q)
              if not q.get("question_en", "").strip():
                  errors.append(f"{q.get('id')}: missing English stem")
              opts = q.get("options_en")
              if not isinstance(opts, list) or len(opts) != 4:
                  errors.append(f"{q.get('id')}: English options must contain exactly four entries")
              if q.get("answer") not in {"A", "B", "C", "D"}:
                  errors.append(f"{q.get('id')}: invalid answer key")
              if q.get("answer") != q.get("official_answer"):
                  errors.append(f"{q.get('id')}: answer differs from stored official answer")
              gu = q.get("question_gu", "")
              guopts = q.get("options_gu", [])
              if gu and (not isinstance(guopts, list) or len(guopts) != 4):
                  errors.append(f"{q.get('id')}: Gujarati stem exists but four options are not present")
              if not gu and guopts:
                  errors.append(f"{q.get('id')}: Gujarati options exist without a Gujarati stem")
          if set(by_paper) != expected_papers:
              errors.append(f"Unexpected paper IDs: {sorted(set(by_paper))}")
          for paper_id in sorted(expected_papers):
              qs = by_paper.get(paper_id, [])
              nums = [q.get("question_no") for q in qs]
              if len(qs) != 100 or set(nums) != set(range(1, 101)) or len(nums) != len(set(nums)):
                  errors.append(f"{paper_id}: expected unique question numbers 1-100; count={len(qs)}")
          unit_ids = {u.get("id") for u in syllabus}
          if len(unit_ids) != 10:
              errors.append(f"Expected 10 official syllabus units; found {len(unit_ids)}")
          for q in questions:
              unit = q.get("syllabus_unit")
              status = q.get("syllabus_mapping_status")
              if unit and unit not in unit_ids:
                  errors.append(f"{q.get('id')}: unknown syllabus unit {unit}")
              if status == "verified_official_syllabus_mapping" and not unit:
                  errors.append(f"{q.get('id')}: verified syllabus mapping has no unit")
          counts = pending.get("counts", {})
          verified = sum(q.get("syllabus_mapping_status") == "verified_official_syllabus_mapping" for q in questions)
          provisional = sum(q.get("syllabus_mapping_status") == "provisional_official_syllabus_mapping" for q in questions)
          mapping_pending = sum(q.get("syllabus_mapping_status") not in {"verified_official_syllabus_mapping", "provisional_official_syllabus_mapping"} for q in questions)
          flags = sum(q.get("review_flag") is True for q in questions)
          if counts.get("total_questions") != len(questions):
              errors.append("verification_pending total_questions does not match questions.json")
          for key, actual in [
              ("syllabus_mapping_verified", verified),
              ("syllabus_mapping_provisional", provisional),
              ("syllabus_mapping_pending", mapping_pending),
              ("review_flags_remaining", flags),
          ]:
              if counts.get(key) != actual:
                  errors.append(f"verification_pending {key}={counts.get(key)} does not match actual {actual}")
          # Keep per-paper summaries synchronized with the authoritative question records.
          paper_metadata = {p.get("paper_id"): p for p in papers}
          if set(paper_metadata) != expected_papers:
              errors.append(f"papers.json IDs do not match question bank: {sorted(paper_metadata)}")
          for paper_id in sorted(expected_papers):
              qs = by_paper.get(paper_id, [])
              meta = paper_metadata.get(paper_id, {})
              v = sum(q.get("syllabus_mapping_status") == "verified_official_syllabus_mapping" for q in qs)
              p = sum(q.get("syllabus_mapping_status") == "provisional_official_syllabus_mapping" for q in qs)
              pend_count = sum(q.get("syllabus_mapping_status") not in {"verified_official_syllabus_mapping", "provisional_official_syllabus_mapping"} for q in qs)
              flags_for_paper = sum(q.get("review_flag") is True for q in qs)
              gu_for_paper = sum(bool(q.get("question_gu", "").strip()) for q in qs)
              paper_checks = {
                  "question_count": len(qs),
                  "questions_loaded": len(qs),
                  "questions_count": len(qs),
                  "source_reviewed_question_count": sum(q.get("source_verified") is True for q in qs),
                  "review_count": flags_for_paper,
                  "review_flags_remaining_count": flags_for_paper,
                  "unit_mapping_verified_count": v,
                  "unit_mapping_provisional_count": p,
                  "unit_mapping_pending_count": pend_count,
                  "gujarati_transcribed_question_count": gu_for_paper,
                  "gujarati_source_not_present_in_official_source_question_count": len(qs) - gu_for_paper,
              }
              for key, actual in paper_checks.items():
                  if meta.get(key) != actual:
                      errors.append(f"papers.json {paper_id} {key}={meta.get(key)} does not match actual {actual}")
              for key in ("answer_key_verified", "question_source_verified", "source_verified"):
                  if meta.get(key) is not True:
                      errors.append(f"papers.json {paper_id} {key} must be true")

          # Keep the app's subject registry synchronized too.
          subject_matches = [s for s in registry if s.get("id") == "hindu_studies" or str(s.get("code")) == "28"]
          if len(subject_matches) != 1:
              errors.append(f"Expected exactly one Hindu Studies Code 28 registry entry; found {len(subject_matches)}")
          else:
              subject = subject_matches[0]
              if subject.get("papers_loaded") != len(expected_papers):
                  errors.append(f"subjects.json papers_loaded={subject.get('papers_loaded')}; expected {len(expected_papers)}")
              if subject.get("questions_loaded") != len(questions):
                  errors.append(f"subjects.json questions_loaded={subject.get('questions_loaded')}; expected {len(questions)}")
              if subject.get("source_verified") is not True:
                  errors.append("subjects.json Hindu Studies source_verified must be true")
              required_summary = f"syllabus mappings {verified} verified, {provisional} provisional, {mapping_pending} pending; {flags} review flags retained"
              if required_summary not in subject.get("data_status", ""):
                  errors.append(f"subjects.json data_status is stale; expected phrase: {required_summary}")
          if errors:
              print("\n".join("ERROR: " + e for e in errors))
              raise SystemExit(1)
          print("Hindu Studies data validation PASSED")
          print(f"Questions: {len(questions)}; session counts: " + ", ".join(f"{p}={len(by_paper[p])}" for p in sorted(expected_papers)))
          print(f"Verified/provisional/pending mappings: {verified}/{provisional}/{mapping_pending}")
          print(f"Source Gujarati records: {sum(bool(q.get('question_gu')) for q in questions)}; review flags: {flags}")
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Android Debug APK
        run: flutter build apk --debug

      - name: Verify APK and calculate SHA-256
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-debug.apk
          test -s "$APK"
          APKSIGNER=$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          echo "APK SHA-256: $(sha256sum "$APK" | cut -d' ' -f1)" >> "$GITHUB_STEP_SUMMARY"
          du -h "$APK" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hindu-studies-code28-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

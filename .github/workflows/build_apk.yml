name: Build GSET Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Merge bundled Paper-II question datasets
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, gzip, json
          from pathlib import Path

          target = Path("assets/subjects/physical_sciences/questions.json")
          packed_dir = Path("assets/subjects/physical_sciences/nov25_b64")

          existing = json.loads(target.read_text(encoding="utf-8"))
          packed = "".join(p.read_text().strip() for p in sorted(packed_dir.glob("part_*.txt")))
          added = json.loads(gzip.decompress(base64.b64decode(packed)).decode("utf-8"))

          by_id = {q["id"]: q for q in existing}
          for q in added:
              by_id[q["id"]] = q

          merged = list(by_id.values())
          merged.sort(key=lambda q: (q.get("paper_id", ""), q.get("id", "")))
          target.write_text(json.dumps(merged, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(f"Merged Paper-II question bank: {len(merged)} questions")

          if len(added) != 100:
              raise SystemExit(f"Expected 100 November 2025 questions, got {len(added)}")
          PY

      - name: Commit merged question bank
        shell: bash
        run: |
          if git diff --quiet -- assets/subjects/physical_sciences/questions.json; then
            echo "No question-bank changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/subjects/physical_sciences/questions.json
            git commit -m "Add November 2025 Physical Sciences questions [skip ci]"
            git push
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Validate question bank integrity
        run: python3 tool/validate_questions.py

      - name: Analyze project
        run: flutter analyze

      # Debug APK is automatically signed with Android's debug keystore.
      # This is intentional for device testing; production release signing
      # should use a private release keystore kept in GitHub Secrets.
      - name: Build installable debug APK
        run: flutter build apk --debug

      - name: Show APK signing fingerprints
        shell: bash
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: gset-test-series-apk-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

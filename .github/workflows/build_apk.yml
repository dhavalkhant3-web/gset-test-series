name: Build GSET Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
  uses: subosito/flutter-action@v2
  with:
    flutter-version: '3.38.10'
    cache: true
      # Regenerates the missing Gradle wrapper/tooling and normalizes
      # the Android Gradle files before the release build.
      - name: Regenerate Android tooling
        run: flutter create --platforms=android --no-pub .

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze
        continue-on-error: true

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gset-test-series-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

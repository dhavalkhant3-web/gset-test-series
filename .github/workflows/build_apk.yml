name: Build GSET Android APK

on:
  workflow_dispatch:
    inputs:
      refresh_physical_archive:
        description: 'Rebuild Physical Sciences archive from official GSET PDFs'
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Install OCR tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr

      - name: Generate December 2021 Chemical Sciences visual assets
        run: |
          python3 -m pip install --disable-pip-version-check --break-system-packages PyMuPDF Pillow
          python3 tool/extract_chemical_dec21_visuals.py
          test $(find assets/images -maxdepth 1 -name 'chemical_dec21_q*.jpg' | wc -l) -eq 25

      - name: Generate November 2022 Chemical Sciences visual assets
        run: |
          python3 -m pip install --disable-pip-version-check --break-system-packages PyMuPDF Pillow
          python3 tool/extract_chemical_nov22_visuals.py
          test $(find assets/images -maxdepth 1 -name 'chemical_nov22_q*.png' | wc -l) -eq 26

      - name: Generate Physical Sciences September 2016 Paper-III visual assets
        run: |
          python3 -m pip install --disable-pip-version-check --break-system-packages PyMuPDF Pillow
          python3 tool/extract_physical_sep16_p3_visuals.py
          test $(find assets/images -maxdepth 1 -name 'physical_sep16_p3_q*.png' | wc -l) -eq 4

      - name: Generate official Physical Sciences archive bank
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.refresh_physical_archive == true }}
        run: |
          python3 tool/import_physical_archive.py
          python3 tool/import_nov25_physical.py
          test -s assets/subjects/physical_sciences/nov25_questions.json
          python3 - <<'PY'
          import json
          p="assets/subjects/physical_sciences/nov25_questions.json"
          q=json.load(open(p,encoding="utf-8"))
          assert len(q)==100
          assert all(len(x.get("options_en",[]))==4 for x in q)
          assert all(x.get("answer") in {"A","B","C","D","Z"} for x in q)

          target="assets/subjects/physical_sciences/questions.json"
          existing=json.load(open(target,encoding="utf-8"))

          # Guard against accidental archive loss/duplication while preserving
          # every existing record exactly unless the importer owns that paper.
          existing_ids=[str(x.get("id")) for x in existing]
          assert len(existing_ids)==len(set(existing_ids)), "Duplicate question IDs already present"

          old={str(x.get("id")) for x in existing}
          for x in q:
              if str(x.get("id")) not in old:
                  x["question_gu"]=x.get("question_en","")
                  x["options_gu"]=list(x.get("options_en",["","","",""]))
                  existing.append(x)

          # Validate by paper rather than by a global minimum.
          expected = {
            "physical_sep16": 50,
            "physical_aug17": 50,
            "physical_sep18": 100,
            "physical_dec19": 100,
            "physical_dec21": 100,
            "physical_nov22": 100,
            "physical_nov23": 100,
            "physical_dec24": 75,
            "physical_nov25": 100,
          }
          counts={}
          for x in existing:
              pid=str(x.get("paper_id") or x.get("paperId") or "")
              counts[pid]=counts.get(pid,0)+1
          for pid,n in expected.items():
              assert counts.get(pid,0)==n, f"{pid}: expected {n}, found {counts.get(pid,0)}"

          # Existing verified archive records may use Z; never coerce them.
          json.dump(existing,open(target,"w",encoding="utf-8"),ensure_ascii=False,indent=2)
          print("Physical Sciences per-paper counts:", {k:counts[k] for k in expected})
          PY

      - name: Validate Physical Sciences archive metadata
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.refresh_physical_archive == true }}
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open("assets/subjects/physical_sciences/papers.json",encoding="utf-8"))
          q=json.load(open("assets/subjects/physical_sciences/questions.json",encoding="utf-8"))
          expected = {
            "physical_sep16": 50, "physical_aug17": 50, "physical_sep18": 100,
            "physical_dec19": 100, "physical_dec21": 100, "physical_nov22": 100,
            "physical_nov23": 100, "physical_dec24": 75, "physical_nov25": 100,
          }
          counts={}
          for x in q:
              pid=x.get("paper_id")
              counts[pid]=counts.get(pid,0)+1
              assert len(x.get("options_en",[]))==4, f"{x.get('id')}: invalid options"
              assert x.get("answer") in {"A","B","C","D","Z"}, f"{x.get('id')}: invalid answer"
          byid={p["paper_id"]:p for p in d["papers"]}
          for pid,n in expected.items():
              assert counts.get(pid,0)==n, f"{pid}: question count {counts.get(pid,0)} != {n}"
              assert byid[pid]["questions_loaded"]==n, f"{pid}: stale questions_loaded"
              assert byid[pid]["questions_count"]==n, f"{pid}: stale questions_count"
          assert counts["physical_nov25"]==100, "November 2025 must remain intact"
          print("Physical Sciences archive metadata is consistent")
          PY

      - name: Validate question bank integrity
        run: python3 tool/validate_questions.py

      - name: Analyze project
        run: flutter analyze

      - name: Build installable debug APK
        run: flutter build apk --debug

      - name: Show APK signing fingerprints
        shell: bash
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: gset-test-series-apk-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

name: Build GSET Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Install OCR tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr

      - name: Generate official Physical Sciences archive bank
        run: |
          python3 tool/import_physical_archive.py
          python3 tool/import_nov25_physical.py
          test -s assets/subjects/physical_sciences/nov25_questions.json
          python3 - <<'PY'
          import json
          p="assets/subjects/physical_sciences/nov25_questions.json"
          q=json.load(open(p,encoding="utf-8"))
          assert len(q)==100
          assert all(len(x.get("options_en",[]))==4 for x in q)
          assert all(x.get("answer") in {"A","B","C","D"} for x in q)
          target="assets/subjects/physical_sciences/questions.json"
          existing=json.load(open(target,encoding="utf-8"))
          old={str(x.get("id")) for x in existing}
          for x in q:
              if str(x.get("id")) not in old:
                  x["question_gu"]=x.get("question_en","")
                  x["options_gu"]=list(x.get("options_en",["","","",""]))
                  existing.append(x)
          assert len(existing)>=325, f"Expected at least 325 questions, found {len(existing)}"
          json.dump(existing,open(target,"w",encoding="utf-8"),ensure_ascii=False,indent=2)
          print("Physical Sciences total questions:",len(existing))
          PY

      - name: Validate question bank integrity
        run: python3 tool/validate_questions.py

      - name: Analyze project
        run: flutter analyze

      - name: Build installable debug APK
        run: flutter build apk --debug

      - name: Show APK signing fingerprints
        shell: bash
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: gset-test-series-apk-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

name: GSET Master Studio — Universal Debug APK

on:
  push:
    branches:
      - feature/gset-master-question-bank-studio
    paths:
      - '.github/workflows/build_master_studio_debug.yml'
      - 'lib/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Flutter project
        run: flutter analyze

      - name: Build universal Debug APK
        run: flutter build apk --debug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-debug.apk
          test -s "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          sha256sum "$APK" | tee apk-sha256.txt
          du -h "$APK"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: gset-master-studio-universal-debug-apk
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            apk-sha256.txt
          if-no-files-found: error
          retention-days: 14
